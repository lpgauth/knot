name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3.27'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-bench-${{ hashFiles('**/rebar.lock', 'c_src/*.c') }}

      - name: Bench (rand vs granderl vs rotor)
        run: make bench | tee bench-results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.txt

      - name: Post results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('bench-results.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## rotor bench results\n\n```\n' + out + '\n```'
            });
